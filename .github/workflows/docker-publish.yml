# This code has been partially generated by an AI.
name: Build, Scan & Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'admin/**'
      - 'plugins.json'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: ghcr.io/semrels/semrel-registry:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/semrels/semrel-registry:buildcache
          cache-to: type=registry,ref=ghcr.io/semrels/semrel-registry:buildcache,mode=max

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.76.0"
        run: sudo .github/scripts/install-trivy.sh "$TRIVY_VERSION"

      - name: Scan API image
        run: trivy image --timeout 10m --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 ghcr.io/semrels/semrel-registry:${{ github.sha }}

      - name: Promote API image to latest
        run: docker buildx imagetools create --tag ghcr.io/semrels/semrel-registry:latest ghcr.io/semrels/semrel-registry:${{ github.sha }}

  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Admin
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./admin/Dockerfile
          push: true
          tags: ghcr.io/semrels/semrel-registry-admin:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/semrels/semrel-registry-admin:buildcache
          cache-to: type=registry,ref=ghcr.io/semrels/semrel-registry-admin:buildcache,mode=max

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.76.0"
        run: sudo .github/scripts/install-trivy.sh "$TRIVY_VERSION"

      - name: Scan Admin image
        run: trivy image --timeout 10m --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 ghcr.io/semrels/semrel-registry-admin:${{ github.sha }}

      - name: Promote Admin image to latest
        run: docker buildx imagetools create --tag ghcr.io/semrels/semrel-registry-admin:latest ghcr.io/semrels/semrel-registry-admin:${{ github.sha }}
