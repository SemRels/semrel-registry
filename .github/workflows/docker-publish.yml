name: Build & Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'admin/**'
      - 'plugins.json'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: |
            ghcr.io/semrels/semrel-registry:latest
            ghcr.io/semrels/semrel-registry:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/semrels/semrel-registry:buildcache
          cache-to: type=registry,ref=ghcr.io/semrels/semrel-registry:buildcache,mode=max

  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Admin
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./admin/Dockerfile
          push: true
          tags: |
            ghcr.io/semrels/semrel-registry-admin:latest
            ghcr.io/semrels/semrel-registry-admin:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/semrels/semrel-registry-admin:buildcache
          cache-to: type=registry,ref=ghcr.io/semrels/semrel-registry-admin:buildcache,mode=max
