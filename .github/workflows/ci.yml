name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "1.26"]
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: api/go.sum
      - name: Download modules
        run: go mod download
      - name: Vet API
        run: go vet ./...
      - name: Test API
        run: go test -race -count=1 ./...
      - name: Build API
        run: go build ./...

  # Security gates. These run on every pull request so a known-vulnerable
  # dependency or an unsafe code pattern is caught before review, not after a
  # deployment.
  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: api/go.sum
      # Reports only the vulnerabilities that are actually reachable from this
      # code, so a finding here is a real exposure rather than a version match.
      - name: Scan Go dependencies for known vulnerabilities
        working-directory: api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      # Installed from source rather than via a marketplace action so the whole
      # tool chain is pinned by Go module version, consistent with how the rest
      # of this repository pins its dependencies.
      - name: Static analysis (gosec)
        working-directory: api
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.9
          gosec -severity medium -confidence medium ./...
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Audit admin dependencies
        working-directory: admin
        run: npm audit --audit-level=high

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: api/go.sum
      - name: Run golangci-lint
        working-directory: api
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2
          golangci-lint run ./...

  admin:
    name: Admin (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test admin
        run: npm run test
      - name: Build admin
        run: npm run build
      - name: Validate admin artifact
        run: test -s dist/index.html

  registry:
    name: Validate registry catalog
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate plugins.json
        run: node .github/scripts/validate-plugins.js plugins.json schemas/plugin-metadata.json
      - name: Test registry sync inventory
        run: node --test .github/scripts/*.test.js

  containers:
    name: Validate container artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: api/Dockerfile
          push: false
          load: true
          tags: semrel-registry-api:ci
      - name: Build and smoke test admin image
        run: .github/scripts/admin-nginx-smoke.sh --image semrel-registry-admin:ci
      # Scans the assembled images, which is the only place an OS-level CVE in
      # the runtime base shows up — dependency scanning of our own code cannot
      # see it.
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.68.0"
        run: |
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          trivy --version
      - name: Scan API image
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 semrel-registry-api:ci
      - name: Scan admin image
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 semrel-registry-admin:ci

  actionlint:
    name: Validate GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
