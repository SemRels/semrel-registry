server {
    # 8080, not 80: the image runs as an unprivileged user, which cannot bind
    # a port below 1024. Publish it with `-p 80:8080`.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Resolve the API at request time so nginx can start before the API is registered in DNS.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=5s;
    resolver_timeout 2s;
    set $api_url ${API_URL};

    # Omitting a URI from proxy_pass preserves the original /schemas/ or /api/ request URI.
    location /schemas/ {
        proxy_pass $api_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass $api_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # The OAuth entry point and callback live on the API. Proxying them through
    # the same origin is what lets the session cookie be host-only rather than
    # shared across a parent domain.
    location /auth/ {
        proxy_pass $api_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Hashed build assets are immutable; the shell that references them is not.
    # A cached index.html is how users land on an asset URL the last deploy
    # removed, so it is explicitly never stored.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
